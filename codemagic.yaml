workflows:
  roomplan-device-test:
    name: RoomPlan test - unsigned iPhone IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.35.4
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Check pinned SDK and resolve packages
        script: |
          set -euo pipefail
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "d693b4b9dbac2acd4477aea4555ca6dcbea44ba2"
          flutter --version
          xcodebuild -version
          flutter pub get --enforce-lockfile
      - name: Analyze and test Flutter
        script: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          mkdir -p build/test-results
          python3 -m venv build/intake-venv
          build/intake-venv/bin/python -m pip install -r scripts/requirements-test.txt
          build/intake-venv/bin/python -m unittest discover -s scripts -p 'test_*.py' -v 2>&1 | tee build/test-results/intake-tests.log
          flutter pub deps --json > build/test-results/flutter-dependencies.json
          build/intake-venv/bin/python -m pip inspect > build/test-results/python-dependencies.json
          cp docs/COMMERCIAL-USE.md build/test-results/
          cp THIRD_PARTY_NOTICES.md build/test-results/
          cp "$FLUTTER_ROOT/LICENSE" build/test-results/FLUTTER-LICENSE.txt
      - name: Compile simulator and test native storage
        script: |
          set -euo pipefail
          mkdir -p build/test-results
          flutter build ios --simulator --debug --no-codesign --no-pub 2>&1 | tee build/test-results/simulator-build.log
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 scripts/select_simulator.py)
          # Own the simulator lifecycle rather than relying on xcodebuild's temporary boot.
          xcrun simctl bootstatus "$DEVICE_ID" -b 2>&1 | tee build/test-results/simulator-boot.log
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/test-results/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test-results/native-tests.log
          # Xcode can shut down the destination after successful tests. Reboot and wait before lookup.
          xcrun simctl bootstatus "$DEVICE_ID" -b 2>&1 | tee build/test-results/simulator-post-test-boot.log
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" be.aproxx.roomplanDeviceTest data)
          cp "$APP_DATA/Documents/zip-writer-fixture.zip" build/test-results/native-zip-fixture.zip
          build/intake-venv/bin/python scripts/verify_native_zip.py build/test-results/native-zip-fixture.zip 2>&1 | tee build/test-results/native-zip-verification.log
      - name: Compile unsigned iPhone release
        script: |
          set -euo pipefail
          mkdir -p build/test-results
          flutter build ios --release --no-codesign --no-pub 2>&1 | tee build/test-results/device-build.log
      - name: Package and check IPA
        script: bash scripts/package_ipa.sh
    artifacts:
      - build/ipa/*.ipa
      - build/test-results/*.log
      - build/test-results/*.xcresult
      - build/test-results/*.json
      - build/test-results/*.md
      - build/test-results/*.txt
      - build/test-results/native-zip-fixture.zip
      - /tmp/xcodebuild_logs/*.log
